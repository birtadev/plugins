<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="#83E7D1" role="img" aria-label="Birta">
<style>
.sun{animation:rise 1.6s cubic-bezier(.45,0,.2,1) .2s both}
.glow{opacity:0;animation:flare 2.4s ease-out 1.4s both}
.hair{transform-box:fill-box;animation:reach 1.6s cubic-bezier(.45,0,.2,1) .2s both}
.hl{transform-origin:right center}.hr{transform-origin:left center}
.trail{animation:fade 1.2s ease-out 1.2s both}
@keyframes rise{from{transform:translateY(13px)}to{transform:translateY(0)}}
@keyframes flare{0%{opacity:0}30%{opacity:.55}100%{opacity:0}}
@keyframes reach{from{transform:scaleX(.35);opacity:.5}to{transform:scaleX(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sun,.glow,.hair,.trail{animation:none}}
</style>
